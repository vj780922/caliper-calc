<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游標卡尺器差值計算器</title>
    <style>
        body {
            font-family: "微軟正黑體", "Calibri", sans-serif;
            background-color: #f4f7f6;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #bdc3c7;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #34495e;
            color: #fff;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        input[type="number"] {
            width: 90%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: right;
            box-sizing: border-box;
            font-family: "Calibri", sans-serif;
        }
        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
        }
        .error {
            color: #e74c3c;
            font-weight: bold;
        }
        .result {
            font-weight: bold;
            color: #2c3e50;
            font-family: "Calibri", sans-serif;
        }
        .btn-container {
            text-align: right;
            margin-top: 20px;
        }
        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-family: "微軟正黑體", sans-serif;
        }
        button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>游標卡尺器差值計算器</h2>
    
    <table>
        <thead>
            <tr>
                <th>項目</th>
                <th>標準值</th>
                <th>量測值 1</th>
                <th>量測值 2</th>
                <th>量測值 3</th>
                <th>器差值</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="3" style="background: #fcfcfc; font-weight: bold;">外徑校正</td>
                <td><input type="number" step="0.001" class="std-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td class="result error">#DIV/0!</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td class="result error">#DIV/0!</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td class="result error">#DIV/0!</td>
            </tr>

            <tr>
                <td rowspan="3" style="background: #fcfcfc; font-weight: bold;">內徑校正</td>
                <td><input type="number" step="0.001" class="std-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td class="result error">#DIV/0!</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td class="result error">#DIV/0!</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td class="result error">#DIV/0!</td>
            </tr>

            <tr>
                <td rowspan="3" style="background: #fcfcfc; font-weight: bold;">深度校正</td>
                <td><input type="number" step="0.001" class="std-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td class="result error">#DIV/0!</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td class="result error">#DIV/0!</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculateRow(this)"></td>
                <td class="result error">#DIV/0!</td>
            </tr>
        </tbody>
    </table>

    <div class="btn-container">
        <button onclick="clearAll()">清除所有數據</button>
    </div>
</div>

<script>
    function calculateRow(element) {
        // 找到當前操作的那個資料列 (tr)
        const row = element.closest('tr');
        
        // 獲取標準值
        const stdInput = row.querySelector('.std-val');
        const stdVal = parseFloat(stdInput.value);
        
        // 獲取所有量測值
        const mInputs = row.querySelectorAll('.m-val');
        let sum = 0;
        let count = 0;
        
        mInputs.forEach(input => {
            if (input.value !== "") {
                sum += parseFloat(input.value);
                count++;
            }
        });
        
        const resultTd = row.querySelector('.result');
        
        // 驗證：必須輸入標準值，且量測值至少要有一個（否則會導致分母為0，即 #DIV/0!）
        if (isNaN(stdVal) || count === 0) {
            resultTd.textContent = "#DIV/0!";
            resultTd.classList.add('error');
            return;
        }
        
        // 計算平均值
        const average = sum / count;
        
        // 計算器差值：ROUND(AVERAGE(量測值) - 標準值, 3)
        const errorVal = (average - stdVal).toFixed(3);
        
        // 顯示結果並移除錯誤樣式
        resultTd.textContent = errorVal;
        resultTd.classList.remove('error');
    }

    function clearAll() {
        // 清除所有輸入框
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.value = "";
        });
        // 重置所有器差值顯示
        document.querySelectorAll('.result').forEach(td => {
            td.textContent = "#DIV/0!";
            td.classList.add('error');
        });
    }
</script>

</body>
</html>
