<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游標卡尺器差值計算器</title>
    <style>
        body {
            font-family: "微軟正黑體", "Calibri", sans-serif;
            background-color: #f4f7f6;
            padding: 40px 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        th, td {
            border: 1px solid #bdc3c7;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #34495e;
            color: #fff;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        input[type="number"] {
            width: 90%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: right;
            box-sizing: border-box;
            font-family: "Calibri", sans-serif;
            background-color: #eef5fc;
        }
        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
            background-color: #fff;
        }
        .waiting {
            color: #7f8c8d;
            font-style: italic;
            font-size: 14px;
        }
        .result {
            font-weight: bold;
            color: #2c3e50;
            font-family: "Calibri", sans-serif;
        }
        
        /* 判定結果區塊樣式 */
        .summary-section {
            margin-top: 25px;
            padding: 15px 5px;
            font-size: 18px;
            font-weight: bold;
        }
        .summary-row {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .summary-label {
            width: 120px;
            color: #333;
        }
        .status-pass {
            color: #27ae60;
            font-size: 22px;
        }
        .status-fail {
            color: #c0392b;
            font-size: 22px;
        }
        .status-wait {
            color: #7f8c8d;
            font-size: 22px;
        }
        .tolerance-badge {
            background-color: #fef9e7;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #f9e79f;
            font-family: "Calibri", "微軟正黑體", sans-serif;
        }

        .btn-container {
            text-align: right;
            margin-top: 20px;
        }
        button {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-family: "微軟正黑體", sans-serif;
        }
        button:hover {
            background-color: #616a6b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>游標卡尺器差值計算器</h2>
    
    <table>
        <thead>
            <tr>
                <th>項目</th>
                <th>標準值</th>
                <th>量測值 1</th>
                <th>量測值 2</th>
                <th>量測值 3</th>
                <th>器差值</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="3" style="background: #fcfcfc; font-weight: bold;">外徑校正</td>
                <td><input type="number" step="0.001" class="std-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td class="result waiting">等待數據輸入...</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td class="result waiting">等待數據輸入...</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td class="result waiting">等待數據輸入...</td>
            </tr>

            <tr>
                <td rowspan="3" style="background: #fcfcfc; font-weight: bold;">內徑校正</td>
                <td><input type="number" step="0.001" class="std-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td class="result waiting">等待數據輸入...</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td class="result waiting">等待數據輸入...</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td class="result waiting">等待數據輸入...</td>
            </tr>

            <tr>
                <td rowspan="3" style="background: #fcfcfc; font-weight: bold;">深度校正</td>
                <td><input type="number" step="0.001" class="std-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td class="result waiting">等待數據輸入...</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td class="result waiting">等待數據輸入...</td>
            </tr>
            <tr>
                <td><input type="number" step="0.001" class="std-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td><input type="number" step="0.001" class="m-val" oninput="calculate()"></td>
                <td class="result waiting">等待數據輸入...</td>
            </tr>
        </tbody>
    </table>

    <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">

    <div class="summary-section">
        <div class="summary-row">
            <span class="summary-label">校正結果：</span>
            <span id="judgment-result" class="status-wait">等待數據輸入...</span>
        </div>
        <div class="summary-row">
            <span class="summary-label">允收標準：</span>
            <span class="tolerance-badge">± 0.02 mm</span>
        </div>
    </div>

    <div class="btn-container">
        <button onclick="clearAll()">清除所有數據</button>
    </div>
</div>

<script>
    function calculate() {
        const rows = document.querySelectorAll('tbody tr');
        let validErrorValues = [];
        let totalRowsCount = rows.length;
        let completeRowsCount = 0;

        rows.forEach(row => {
            const stdInput = row.querySelector('.std-val');
            const stdVal = parseFloat(stdInput.value);
            
            const mInputs = row.querySelectorAll('.m-val');
            let sum = 0;
            let count = 0;
            
            mInputs.forEach(input => {
                if (input.value !== "") {
                    sum += parseFloat(input.value);
                    count++;
                }
            });
            
            const resultTd = row.querySelector('.result');
            
            // 強制控管：必須填入標準值，且 3 個量測值必須全部填滿
            if (isNaN(stdVal) || count < 3) {
                resultTd.textContent = "等待數據輸入...";
                resultTd.className = "result waiting";
                return;
            }
            
            // 滿足條件（標準值 + 3個量測值皆有），執行計算
            completeRowsCount++;
            const average = sum / 3;
            const errorVal = Math.round((average - stdVal) * 1000) / 1000;
            
            resultTd.textContent = errorVal.toFixed(3);
            resultTd.className = "result";
            
            validErrorValues.push(errorVal);
        });

        const judgmentTd = document.getElementById('judgment-result');
        
        // 如果沒有任何一列完整填滿，總結果維持等待
        if (validErrorValues.length === 0) {
            judgmentTd.textContent = "等待數據輸入...";
            judgmentTd.className = "status-wait";
            return;
        }

        // 找出目前已有數據的最大值與最小值
        const maxError = Math.max(...validErrorValues);
        const minError = Math.min(...validErrorValues);

        const roundedMax = Math.round(maxError * 1000) / 1000;
        const roundedMin = Math.round(minError * 1000) / 1000;

        // 判定邏輯
        if (roundedMax <= 0.02 && roundedMin >= -0.02) {
            if (completeRowsCount < totalRowsCount) {
                // 如果目前算出來的都合格，但表格還沒全部填完
                judgmentTd.textContent = "合格 (尚有項目未填寫)";
                judgmentTd.className = "status-pass";
            } else {
                // 全表格 9 項目皆完整填滿且合格
                judgmentTd.textContent = "合格";
                judgmentTd.className = "status-pass";
            }
        } else {
            // 只要有任何一列算出來的結果爆掉，直接判定不合格
            judgmentTd.textContent = "不合格";
            judgmentTd.className = "status-fail";
        }
    }

    function clearAll() {
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.value = "";
        });
        document.querySelectorAll('.result').forEach(td => {
            td.textContent = "等待數據輸入...";
            td.className = "result waiting";
        });
        const judgmentTd = document.getElementById('judgment-result');
        judgmentTd.textContent = "等待數據輸入...過";
        judgmentTd.className = "status-wait";
        calculate(); // 重新觸發狀態重置
    }
</script>

</body>
</html>
