<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游標卡尺器差值計算器 - Weiwei</title>
    <style>
        /* 字型設定：英文 Calibri, 中文 微軟正黑體 */
        body {
            font-family: "Calibri", "Microsoft JhengHei", sans-serif;
            background-color: #f4f7f9;
            color: #2d3748;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 35px;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #1a365d;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .section-label {
            font-weight: bold;
            margin-bottom: 15px;
            display: block;
            color: #3182ce;
            border-left: 4px solid #3182ce;
            padding-left: 10px;
            font-size: 16px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1.2fr repeat(3, 1fr) 1.2fr;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        .header-row {
            font-size: 12px;
            color: #718096;
            font-weight: bold;
            text-align: center;
            margin-bottom: 8px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            text-align: right;
            font-family: "Calibri", "Microsoft JhengHei";
            background-color: #eef5fc; /* 淡藍色輸入格 */
        }

        input[type="number"]:focus {
            border-color: #3182ce;
            background-color: #fff;
        }

        .calc-res {
            font-size: 14px;
            font-weight: bold;
            color: #2d3748;
            text-align: center;
            font-family: "Calibri", sans-serif;
        }

        .waiting {
            color: #a0aec0;
            font-style: italic;
            font-size: 12px;
            font-weight: normal;
        }

        .result-area {
            margin-top: 25px;
            padding: 20px;
            background-color: #ebf8ff;
            border-radius: 12px;
            border: 1px solid #bee3f8;
        }

        .result-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
        }

        .final-status {
            font-size: 22px;
        }

        .status-pass {
            color: #38a169;
        }

        .status-fail {
            color: #e53e3e;
        }

        .status-wait {
            color: #718096;
            font-size: 18px;
            font-style: italic;
            font-weight: normal;
        }

        .tolerance-badge {
            background-color: #fffaf0;
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid #feebc8;
            color: #dd6b20;
            font-size: 14px;
        }

        .divider {
            border: 0;
            border-top: 1px dashed #e2e8f0;
            margin: 20px 0;
        }

        .footer-info {
            text-align: center;
            font-size: 13px;
            color: #718096;
            line-height: 2;
        }

        .visit-badge {
            background: #e2e8f0;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: bold;
            color: #4a5568;
            margin-left: 5px;
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            background-color: #edf2f7;
            color: #4a5568;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
            font-family: "Microsoft JhengHei";
        }

        .clear-btn:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>游標卡尺器差值計算器</h2>

        <div class="input-row header-row">
            <div>標準值</div>
            <div>量測值 1</div>
            <div>量測值 2</div>
            <div>量測值 3</div>
            <div>器差值結果</div>
        </div>

        <span class="section-label">外徑校正</span>
        <div class="input-row row-item">
            <input type="number" step="0.001" class="std-val" oninput="calculate()">
            <input type="number" step="0.001" class="m1-val" oninput="calculate()">
            <input type="number" step="0.001" class="m2-val" oninput="calculate()">
            <input type="number" step="0.001" class="m3-val" oninput="calculate()">
            <div class="calc-res waiting">等待數據輸入...</div>
        </div>
        <div class="input-row row-item">
            <input type="number" step="0.001" class="std-val" oninput="calculate()">
            <input type="number" step="0.001" class="m1-val" oninput="calculate()">
            <input type="number" step="0.001" class="m2-val" oninput="calculate()">
            <input type="number" step="0.001" class="m3-val" oninput="calculate()">
            <div class="calc-res waiting">等待數據輸入...</div>
        </div>
        <div class="input-row row-item">
            <input type="number" step="0.001" class="std-val" oninput="calculate()">
            <input type="number" step="0.001" class="m1-val" oninput="calculate()">
            <input type="number" step="0.001" class="m2-val" oninput="calculate()">
            <input type="number" step="0.001" class="m3-val" oninput="calculate()">
            <div class="calc-res waiting">等待數據輸入...</div>
        </div>

        <div class="divider"></div>

        <span class="section-label">內徑校正</span>
        <div class="input-row row-item">
            <input type="number" step="0.001" class="std-val" oninput="calculate()">
            <input type="number" step="0.001" class="m1-val" oninput="calculate()">
            <input type="number" step="0.001" class="m2-val" oninput="calculate()">
            <input type="number" step="0.001" class="m3-val" oninput="calculate()">
            <div class="calc-res waiting">等待數據輸入...</div>
        </div>
        <div class="input-row row-item">
            <input type="number" step="0.001" class="std-val" oninput="calculate()">
            <input type="number" step="0.001" class="m1-val" oninput="calculate()">
            <input type="number" step="0.001" class="m2-val" oninput="calculate()">
            <input type="number" step="0.001" class="m3-val" oninput="calculate()">
            <div class="calc-res waiting">等待數據輸入...</div>
        </div>
        <div class="input-row row-item">
            <input type="number" step="0.001" class="std-val" oninput="calculate()">
            <input type="number" step="0.001" class="m1-val" oninput="calculate()">
            <input type="number" step="0.001" class="m2-val" oninput="calculate()">
            <input type="number" step="0.001" class="m3-val" oninput="calculate()">
            <div class="calc-res waiting">等待數據輸入...</div>
        </div>

        <div class="divider"></div>

        <span class="section-label">深度校正</span>
        <div class="input-row row-item">
            <input type="number" step="0.001" class="std-val" oninput="calculate()">
            <input type="number" step="0.001" class="m1-val" oninput="calculate()">
            <input type="number" step="0.001" class="m2-val" oninput="calculate()">
            <input type="number" step="0.001" class="m3-val" oninput="calculate()">
            <div class="calc-res waiting">等待數據輸入...</div>
        </div>
        <div class="input-row row-item">
            <input type="number" step="0.001" class="std-val" oninput="calculate()">
            <input type="number" step="0.001" class="m1-val" oninput="calculate()">
            <input type="number" step="0.001" class="m2-val" oninput="calculate()">
            <input type="number" step="0.001" class="m3-val" oninput="calculate()">
            <div class="calc-res waiting">等待數據輸入...</div>
        </div>
        <div class="input-row row-item">
            <input type="number" step="0.001" class="std-val" oninput="calculate()">
            <input type="number" step="0.001" class="m1-val" oninput="calculate()">
            <input type="number" step="0.001" class="m2-val" oninput="calculate()">
            <input type="number" step="0.001" class="m3-val" oninput="calculate()">
            <div class="calc-res waiting">等待數據輸入...</div>
        </div>

        <div class="result-area">
            <div class="result-line" style="margin-bottom: 12px;">
                <span style="color: #4a5568;">允收標準設定</span>
                <span class="tolerance-badge">± 0.02 mm</span>
            </div>
            <div class="result-line" style="border-top: 2px dashed #90cdf4; padding-top: 12px;">
                <span style="color: #1a365d;">總體校正結果：</span>
                <span id="final-judgment" class="final-status status-wait">等待數據輸入...</span>
            </div>
        </div>

        <button class="clear-btn" onclick="clearAll()">重置清除所有數據</button>
    </div>

    <div class="footer-info">
        <div>作者：Weiwei | 版本：v1.0.0 | 最後更新日期：2026/06/04</div>
        <div>拜訪次數：<span class="visit-badge" id="visitCount">0</span></div>
    </div>
</div>

<script>
    // 網頁載入時執行：紀錄並讀取拜訪次數
    window.onload = function() {
        let count = localStorage.getItem('weiwei_caliper_calc_visits') || 0;
        count = parseInt(count) + 1;
        localStorage.setItem('weiwei_caliper_calc_visits', count);
        document.getElementById('visitCount').innerText = count;
    };

    function calculate() {
        const rows = document.querySelectorAll('.row-item');
        let validErrorValues = [];
        let totalRows = rows.length;
        let completeRows = 0;

        rows.forEach(row => {
            const stdVal = parseFloat(row.querySelector('.std-val').value);
            const m1 = parseFloat(row.querySelector('.m1-val').value);
            const m2 = parseFloat(row.querySelector('.m2-val').value);
            const m3 = parseFloat(row.querySelector('.m3-val').value);
            
            const resDiv = row.querySelector('.calc-res');
            
            // 強制卡控：標準值與 3 個量測值皆不可為空
            if (isNaN(stdVal) || isNaN(m1) || isNaN(m2) || isNaN(m3)) {
                resDiv.textContent = "等待數據輸入...";
                resDiv.className = "calc-res waiting";
                return;
            }
            
            // 滿足 3 個測值輸入後執行計算
            completeRows++;
            const average = (m1 + m2 + m3) / 3;
            const errorVal = Math.round((average - stdVal) * 1000) / 1000;
            
            resDiv.textContent = errorVal.toFixed(3);
            resDiv.className = "calc-res";
            
            validErrorValues.push(errorVal);
        });

        const judgmentEl = document.getElementById('final-judgment');
        
        // 如果沒有任何一列完整填滿，總結果維持等待
        if (validErrorValues.length === 0) {
            judgmentEl.textContent = "等待數據輸入...";
            judgmentEl.className = "final-status status-wait";
            return;
        }

        // 找出目前計算結果的最大與最小值
        const maxError = Math.max(...validErrorValues);
        const minError = Math.min(...validErrorValues);

        const roundedMax = Math.round(maxError * 1000) / 1000;
        const roundedMin = Math.round(minError * 1000) / 1000;

        // 邏輯判定
        if (roundedMax <= 0.02 && roundedMin >= -0.02) {
            if (completeRows < totalRows) {
                judgmentEl.textContent = "合格 (尚有項目未填寫)";
                judgmentEl.className = "final-status status-pass";
                judgmentEl.style.fontSize = "16px";
            } else {
                judgmentEl.textContent = "合格";
                judgmentEl.className = "final-status status-pass";
                judgmentEl.style.fontSize = "22px";
            }
        } else {
            judgmentEl.textContent = "不合格";
            judgmentEl.className = "final-status status-fail";
            judgmentEl.style.fontSize = "22px";
        }
    }

    function clearAll() {
        document.querySelectorAll('input[type="number"]').forEach(input => {
            input.value = "";
        });
        document.querySelectorAll('.calc-res').forEach(div => {
            div.textContent = "等待數據輸入...";
            div.className = "calc-res waiting";
        });
        const judgmentEl = document.getElementById('final-judgment');
        judgmentEl.textContent = "等待數據輸入...";
        judgmentEl.className = "final-status status-wait";
        judgmentEl.style.fontSize = "18px";
    }
</script>

</body>
</html>
